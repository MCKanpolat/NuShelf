{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nushelf.fullname" . }}
  labels:
    {{- include "nushelf.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secrets.adminApiKeyKey }}: {{ .Values.secrets.adminApiKey | b64enc | quote }}
  {{ .Values.secrets.databaseUrlKey }}: {{ .Values.secrets.databaseUrl | b64enc | quote }}
{{- end }}
