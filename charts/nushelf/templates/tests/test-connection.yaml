apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nushelf.fullname" . }}-test
  labels:
    {{- include "nushelf.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: curlimages/curl:8.10.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      args:
        - --fail
        - --silent
        - --show-error
        - --retry
        - "5"
        - --retry-all-errors
        - http://{{ include "nushelf.fullname" . }}:{{ .Values.service.port }}/health/ready
