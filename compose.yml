name: nushelf
services:
  app:
    build: .
    env_file: .env
    ports: ["127.0.0.1:5000:5000"]
    environment:
      DATABASE_URL: postgres://nushelf:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/nushelf
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_PATH: /data/packages
      MAX_PACKAGE_BYTES: ${MAX_PACKAGE_BYTES:-104857600}
      DATABASE_CONNECTIONS: ${DATABASE_CONNECTIONS:-20}
      AWS_BUCKET: ${AWS_BUCKET:-nushelf}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-false}
      AWS_VIRTUAL_HOSTED_STYLE_REQUEST: ${AWS_VIRTUAL_HOSTED_STYLE_REQUEST:-false}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-}
      GOOGLE_BUCKET: ${GOOGLE_BUCKET:-}
      GOOGLE_SERVICE_ACCOUNT_PATH: ${GOOGLE_SERVICE_ACCOUNT_PATH:-}
    volumes: ["packages:/data/packages"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: nushelf
      POSTGRES_USER: nushelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nushelf -d nushelf"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  minio:
    build: {context: ., dockerfile: docker/minio.Dockerfile, target: minio}
    profiles: ["s3"]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-nushelf-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-}
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    build: {context: ., dockerfile: docker/minio.Dockerfile, target: mc}
    profiles: ["s3"]
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-nushelf-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_BUCKET: ${AWS_BUCKET:-nushelf}
    entrypoint: /bin/sh
    command: ["-c", 'until mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"; do sleep 1; done; mc mb --ignore-existing "local/$$AWS_BUCKET"']
volumes:
  packages:
  postgres-data:
  minio-data:
