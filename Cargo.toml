[package]
name = "nushelf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A self-hosted NuGet V3 registry with PostgreSQL, pluggable storage and MCP"

[features]
default = []
performance-tests = []

[dependencies]
anyhow = "1"
ammonia = "4"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
object_store = { version = "0.12", features = ["aws", "azure", "gcp"] }
roxmltree = "0.20"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }

[profile.release]
lto = "thin"
strip = true
